<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВетКлиника — Запись</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dynamic.css">
</head>
<body>

  <header class="header">
    <button class="icon-btn" onclick="history.back()">←</button>
    <h1>Запись к врачу</h1>
  </header>

  <section class="form-section">
    <h2>1. Выберите питомца</h2>
    <div class="radio-group">
      <label class="radio-card">
        <input type="radio" name="pet" value="Барсик" checked>
        <span>🐱 Барсик</span>
      </label>
      <label class="radio-card">
        <input type="radio" name="pet" value="Рекс">
        <span>🐶 Рекс</span>
      </label>
    </div>
  </section>

  <section class="form-section">
    <h2>2. Выберите врача</h2>
    <select id="doctorSelect" class="input-full">
      <option value="">— Выберите врача —</option>
      <option value="Иванов И.И.">Иванов И.И. — терапевт</option>
      <option value="Петрова А.С.">Петрова А.С. — хирург</option>
      <option value="Сидоров В.В.">Сидоров В.В. — стоматолог</option>
    </select>
  </section>

  <section class="form-section">
    <h2>3. Выберите дату и время</h2>
    <input type="date" id="dateInput" class="input-full">
    <div class="time-slots">
      <button class="slot" onclick="selectSlot(this, '10:00')">10:00</button>
      <button class="slot" onclick="selectSlot(this, '11:30')">11:30</button>
      <button class="slot" onclick="selectSlot(this, '14:00')">14:00</button>
      <button class="slot" onclick="selectSlot(this, '15:30')">15:30</button>
      <button class="slot" onclick="selectSlot(this, '17:00')">17:00</button>
    </div>
    <p id="formError" class="error-msg"></p>
  </section>

  <button class="btn-primary" onclick="submitAppointment()">Записаться</button>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span>Главная</a>
    <a href="appointment.html" class="nav-item active"><span>📅</span>Запись</a>
    <a href="#" class="nav-item"><span>🛒</span>Магазин</a>
    <a href="#" class="nav-item"><span>💬</span>Чат</a>
    <a href="#" class="nav-item"><span>👤</span>Профиль</a>
  </nav>

  <div id="toast" class="toast"></div>
  <script src="js/script.js"></script>
</body>
</html>
