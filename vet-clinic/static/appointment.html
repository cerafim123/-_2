<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВетКлиника — Запись</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <button class="icon-btn" onclick="location.href='index.html'">←</button>
    <h1>Запись к врачу</h1>
  </header>

  <section class="form-section">
    <h2>1. Выберите питомца</h2>
    <div class="radio-group">
      <label class="radio-card">
        <input type="radio" name="pet" checked>
        <span>🐱 Барсик</span>
      </label>
      <label class="radio-card">
        <input type="radio" name="pet">
        <span>🐶 Рекс</span>
      </label>
    </div>
  </section>

  <section class="form-section">
    <h2>2. Выберите врача</h2>
    <select class="input-full">
      <option>— Выберите врача —</option>
      <option>Иванов И.И. — терапевт</option>
      <option>Петрова А.С. — хирург</option>
      <option>Сидоров В.В. — стоматолог</option>
    </select>
  </section>

  <section class="form-section">
    <h2>3. Выберите дату и время</h2>
    <input type="date" class="input-full">
    <div class="time-slots">
      <button class="slot">10:00</button>
      <button class="slot">11:30</button>
      <button class="slot">14:00</button>
      <button class="slot">15:30</button>
      <button class="slot">17:00</button>
    </div>
  </section>

  <button class="btn-primary">Записаться</button>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span>Главная</a>
    <a href="appointment.html" class="nav-item active"><span>📅</span>Запись</a>
    <a href="#" class="nav-item"><span>🛒</span>Магазин</a>
    <a href="#" class="nav-item"><span>💬</span>Чат</a>
    <a href="#" class="nav-item"><span>👤</span>Профиль</a>
  </nav>

</body>
</html>
